<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcolo prezzo biglietto</title>
</head>

<body>

  <h1>Ticket Price Calculator</h1>

  <!-- Form per la raccolta dei dati -->
  <form id="ticketForm">
    <label for="distance">Distanza (km):</label>
    <input id="distance" type="text" name="distance" placeholder="Inserisci il numero di kilometri" required>

    <label for="age">Età:</label>
    <input id="age" type="text" name="age" placeholder="Inserisci l'età" required>

    <button type="submit">Calcola</button>
  </form>

  <div id="results">


  </div>


  <script src="./js/script.js"></script>
</body>

</html>
